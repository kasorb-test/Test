<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KASORB TEST</title>
<style>
:root{--o:#f58220;--ink:#172033;--bg:#f6f7fb;--line:#e5e8ef;--ok:#178a52;--bad:#c43b3b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px}.wrap{max-width:900px;margin:auto;padding:18px}.brand{font-weight:900;font-size:23px}.brand b{color:var(--o)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 5px 18px #1720330a}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--o);color:#fff}.ghost{background:#eef1f6;color:var(--ink)}.danger{background:#fff0f0;color:var(--bad)}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;margin:6px 0 10px;font-size:16px}.muted{color:#697386}.hide{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.set{border:1px solid var(--line);border-radius:16px;padding:16px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#fff1e5;color:#9a4c08;font-weight:700;font-size:13px}.free{background:#eaf8f0;color:#147646}.locked{background:#fff0f0;color:#a33333}.msg{padding:12px;border-radius:12px;background:#fff7e8;margin:10px 0}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.timer{font-weight:900;font-size:20px}.progress{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--o);width:0}.choice{display:block;border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}.choice:has(input:checked){border:2px solid var(--o);background:#fff8f1}.navnums{display:flex;gap:7px;flex-wrap:wrap}.num{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px}.num.answered{background:#fff1e5}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.review{border-left:4px solid var(--line);padding-left:13px;margin:18px 0}.correct{border-color:var(--ok)}.wrong{border-color:var(--bad)}footer{text-align:center;color:#7c8595;padding:20px}
</style></head><body>
<header><div class="wrap" style="padding:0"><div class="brand">KASORB <b>TEST</b></div></div></header><main class="wrap">
<section id="auth"><div class="card"><h1>เข้าสู่ระบบ KASORB TEST</h1><p class="muted">สมัครสมาชิกด้วยอีเมล ตั้งชื่อที่ใช้แสดงได้เอง และใส่อิโมจิในชื่อได้ เช่น “แอดมิน 👮”</p><div id="authMsg"></div><input id="email" type="email" placeholder="อีเมล"><input id="password" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)"><input id="displayName" placeholder="ชื่อที่ใช้แสดง เช่น แอดมิน 👮"><div class="row"><button class="btn primary" id="loginBtn">เข้าสู่ระบบ</button><button class="btn ghost" id="registerBtn">สมัครสมาชิก</button><button class="btn ghost" id="resetBtn">ลืมรหัสผ่าน</button></div></div></section>
<section id="home" class="hide"><div class="card"><div class="topline"><div><h2 id="hello" style="margin:0"></h2><p id="statusText" class="muted"></p></div><button class="btn ghost" id="logoutBtn">ออกจากระบบ</button></div></div><div id="pending" class="card hide"><h2>⏳ รอแอดมินอนุมัติ</h2><p>บัญชีของคุณสมัครสำเร็จแล้ว ข้อสอบฟรีสามารถทำได้ ส่วนข้อสอบสมาชิกจะเปิดหลังจากแอดมินอนุมัติบัญชีค่ะ</p></div><div class="card"><h2>ชุดข้อสอบ</h2><div id="sets" class="grid"></div></div></section>
<section id="exam" class="hide"><div class="card"><div class="topline"><div><span id="examSet" class="badge"></span><h2 id="subject" style="margin:8px 0 0"></h2></div><div class="timer" id="timer"></div></div><p id="counter" class="muted"></p><div class="progress"><i id="bar"></i></div></div><div class="card"><h3 id="question"></h3><div id="choices"></div><div class="actions"><button class="btn ghost" id="prevBtn">← ก่อนหน้า</button><button class="btn primary" id="nextBtn">ถัดไป →</button></div></div><div class="card"><h3>กระดาษคำตอบ</h3><div id="navnums" class="navnums"></div><br><button class="btn danger" id="submitBtn">ส่งข้อสอบและตรวจคะแนน</button></div></section><section id="result" class="hide"></section>
</main><footer>KASORB TEST</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAE7MoJ1ccr5Pf2pYr6JMyvnPPmBfxd_RE",authDomain:"kasorb-test-ad000.firebaseapp.com",projectId:"kasorb-test-ad000",storageBucket:"kasorb-test-ad000.firebasestorage.app",messagingSenderId:"999267444865",appId:"1:999267444865:web:5509772cd5f94af768c580"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let profile=null;
const quizSets=[{id:"free1",title:"ชุดทดลองฟรี",minutes:20,access:"free",questions:[{subject:"ความสามารถทั่วไป",q:"ถ้า 5 : 8 = x : 40 แล้ว x มีค่าเท่าใด",c:["5","10","20","25"],a:3,e:"5/8 = x/40 ดังนั้น x = 25"},{subject:"ภาษาไทย",q:"ข้อใดเป็นคำซ้ำ",c:["บ้านเรือน","เด็ก ๆ","รถไฟ","น้ำใจ"],a:1,e:"เด็ก ๆ เป็นคำซ้ำ โดยใช้ไม้ยมก"},{subject:"ภาษาอังกฤษ",q:"She ___ to school every day.",c:["go","goes","going","gone"],a:1,e:"ประธาน She ใน Present Simple ใช้ goes"}]},{id:"member1",title:"ชุดสมาชิก ชุดที่ 1",minutes:30,access:"member",questions:[{subject:"คอมพิวเตอร์",q:"ข้อใดเป็นเว็บเบราว์เซอร์",c:["Safari","Excel","PowerPoint","Windows"],a:0,e:"Safari เป็นเว็บเบราว์เซอร์"},{subject:"กฎหมาย",q:"ข้อใดเป็นตัวอย่างของกฎหมายมหาชน",c:["กฎหมายแพ่ง","กฎหมายพาณิชย์","กฎหมายปกครอง","สัญญาซื้อขาย"],a:2,e:"กฎหมายปกครองเป็นสาขาหนึ่งของกฎหมายมหาชน"}]}];
const $=id=>document.getElementById(id);function msg(t,bad=false){$("authMsg").innerHTML=`<div class="msg" style="${bad?'background:#fff0f0':''}">${t}</div>`}function screen(id){["auth","home","exam","result"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
$("registerBtn").onclick=async()=>{try{let email=$("email").value.trim(),pw=$("password").value,name=$("displayName").value.trim();if(!name)return msg("กรุณาตั้งชื่อที่ใช้แสดงก่อนค่ะ",true);let c=await createUserWithEmailAndPassword(auth,email,pw);await updateProfile(c.user,{displayName:name});await setDoc(doc(db,"users",c.user.uid),{email,name,active:false,createdAt:serverTimestamp()});msg("สมัครสำเร็จ กำลังเข้าสู่ระบบ…")}catch(e){msg("สมัครไม่สำเร็จ: "+friendly(e),true)}};
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){msg("เข้าสู่ระบบไม่สำเร็จ: "+friendly(e),true)}};$("resetBtn").onclick=async()=>{try{let e=$("email").value.trim();if(!e)return msg("กรอกอีเมลก่อนค่ะ",true);await sendPasswordResetEmail(auth,e);msg("ส่งอีเมลสำหรับตั้งรหัสผ่านใหม่แล้วค่ะ")}catch(e){msg("ส่งอีเมลไม่สำเร็จ: "+friendly(e),true)}};$("logoutBtn").onclick=()=>signOut(auth);
function friendly(e){let c=e.code||"";if(c.includes("email-already-in-use"))return"อีเมลนี้สมัครแล้ว";if(c.includes("invalid-credential"))return"อีเมลหรือรหัสผ่านไม่ถูกต้อง";if(c.includes("weak-password"))return"รหัสผ่านต้องมีอย่างน้อย 6 ตัว";if(c.includes("invalid-email"))return"รูปแบบอีเมลไม่ถูกต้อง";return e.message}
onAuthStateChanged(auth,async u=>{if(!u){profile=null;screen("auth");return}let r=await getDoc(doc(db,"users",u.uid));profile=r.exists()?r.data():{name:u.displayName||u.email,active:false};$("hello").textContent=`สวัสดี ${profile.name||u.email}`;$("statusText").textContent=profile.active?"✅ สมาชิกได้รับอนุมัติแล้ว":"บัญชีสมาชิก: รออนุมัติ";$("pending").classList.toggle("hide",!!profile.active);renderSets();screen("home")});
function renderSets(){$("sets").innerHTML=quizSets.map((s,i)=>{let lock=s.access==="member"&&!profile?.active;return `<div class="set"><span class="badge ${s.access==='free'?'free':lock?'locked':''}">${s.access==='free'?'ฟรี':lock?'🔒 สมาชิก':'สมาชิก'}</span><h3>${s.title}</h3><p class="muted">${s.questions.length} ข้อ • ${s.minutes} นาที</p><button class="btn ${lock?'ghost':'primary'}" ${lock?'disabled':''} data-set="${i}">${lock?'รออนุมัติ':'เริ่มทำข้อสอบ'}</button></div>`}).join("");document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>startExam(+b.dataset.set))}
let active=null,idx=0,answers=[],left=0,tick=null;function startExam(i){active=quizSets[i];if(active.access==='member'&&!profile?.active)return;idx=0;answers=Array(active.questions.length).fill(null);left=active.minutes*60;screen("exam");renderNav();renderQ();clearInterval(tick);tick=setInterval(()=>{left--;renderTimer();if(left<=0)submitExam(true)},1000);renderTimer()}function renderTimer(){let m=Math.max(0,Math.floor(left/60)),s=Math.max(0,left%60);$("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}function renderQ(){let q=active.questions[idx];$("examSet").textContent=active.title;$("subject").textContent=q.subject;$("counter").textContent=`ข้อ ${idx+1} จาก ${active.questions.length} • ตอบแล้ว ${answers.filter(x=>x!==null).length} ข้อ`;$("bar").style.width=((idx+1)/active.questions.length*100)+"%";$("question").textContent=(idx+1)+". "+q.q;$("choices").innerHTML=q.c.map((x,j)=>`<label class="choice"><input type="radio" name="c" ${answers[idx]===j?'checked':''} data-choice="${j}"> ${j+1}. ${x}</label>`).join("");document.querySelectorAll("[data-choice]").forEach(r=>r.onchange=()=>{answers[idx]=+r.dataset.choice;renderQ()});renderNav()}function renderNav(){$("navnums").innerHTML=active.questions.map((_,i)=>`<button class="num ${answers[i]!==null?'answered':''}" data-go="${i}">${i+1}</button>`).join("");document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{idx=+b.dataset.go;renderQ();scrollTo(0,0)})}$("nextBtn").onclick=()=>{if(idx<active.questions.length-1){idx++;renderQ();scrollTo(0,0)}};$("prevBtn").onclick=()=>{if(idx>0){idx--;renderQ();scrollTo(0,0)}};$("submitBtn").onclick=()=>submitExam(false);
async function submitExam(auto){if(!auto&&!confirm("ต้องการส่งข้อสอบและตรวจคะแนนใช่หรือไม่?"))return;clearInterval(tick);let score=active.questions.reduce((n,q,i)=>n+(answers[i]===q.a),0);try{await addDoc(collection(db,"attempts"),{uid:auth.currentUser.uid,setId:active.id,title:active.title,score,total:active.questions.length,submittedAt:serverTimestamp()})}catch(e){}let html=`<div class="card"><h1>ผลการทำข้อสอบ</h1><h2>${score} / ${active.questions.length} คะแนน</h2><button class="btn primary" id="backHome">กลับหน้าชุดข้อสอบ</button></div><div class="card"><h2>เฉลยอธิบาย</h2>`;active.questions.forEach((q,i)=>{let ok=answers[i]===q.a;html+=`<div class="review ${ok?'correct':'wrong'}"><b>ข้อ ${i+1}. ${q.q}</b><p>คำตอบของคุณ: ${answers[i]===null?'ไม่ได้ตอบ':(answers[i]+1)+'. '+q.c[answers[i]]}</p><p><b>เฉลย: ${q.a+1}. ${q.c[q.a]}</b></p><p class="muted">${q.e}</p></div>`});$("result").innerHTML=html+"</div>";screen("result");$("backHome").onclick=()=>{renderSets();screen("home")};scrollTo(0,0)}
</script></body></html>
