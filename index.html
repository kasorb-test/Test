<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KASORB TEST</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f6f6;font-family:system-ui,-apple-system,sans-serif;color:#222}.w{max-width:720px;margin:auto;padding:18px}.brand{font-size:28px;font-weight:900;color:#f47b20}.card{background:white;border:1px solid #e8e8e8;border-radius:18px;padding:20px;margin-top:16px}input{width:100%;padding:13px;border:1px solid #ccc;border-radius:11px;margin:6px 0;font-size:16px}button,.btn{display:block;width:100%;padding:13px;border:0;border-radius:11px;font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}.orange{background:#f47b20;color:white}.outline{background:white;color:#f47b20;border:1px solid #f47b20;margin-top:9px}.light{background:#eee;color:#222;margin-top:9px}.black{background:#222;color:white;margin-top:14px}.hide{display:none}.muted{color:#666}ul{line-height:1.9;padding-left:22px}.q{font-size:18px;font-weight:700;margin:18px 0 8px}label{display:block;border:1px solid #ddd;padding:11px;border-radius:10px;margin:7px 0}label input{width:auto;margin-right:8px}</style></head>
<body><main class="w"><div class="brand">KASORB TEST</div><div class="muted">ระบบฝึกทำข้อสอบออนไลน์</div>
<section id="authBox" class="card"><h2 id="title">เข้าสู่ระบบ</h2><input id="email" type="email" placeholder="อีเมล"><input id="pass" type="password" placeholder="รหัสผ่านอย่างน้อย 6 ตัว"><button id="go" class="orange">เข้าสู่ระบบ</button><button id="switch" class="outline">สมัครสมาชิกฟรี</button><button id="forgot" class="light">ลืมรหัสผ่าน</button><p id="msg" class="muted"></p></section>
<section id="home" class="hide"><div class="card"><b id="who"></b><button id="logout" class="light">ออกจากระบบ</button></div>
<div class="card"><h2>ข้อสอบฟรี</h2><p>สมัครสมาชิกแล้วทดลองทำข้อสอบฟรีได้ทันที</p><button id="start" class="orange">เริ่มทำข้อสอบฟรี</button></div>
<div class="card"><h2>อยากทำข้อสอบเพิ่ม?</h2><p>เข้าถึงข้อสอบเพิ่มเติม พร้อม <b>เฉลยและคำอธิบาย</b></p><ul><li>ฝึกทำได้หลายชุด</li><li>ทำซ้ำได้</li><li>ดูคะแนนหลังส่งคำตอบ</li><li>มีไฟล์ PDF ให้ดาวน์โหลด</li></ul><a class="btn black" href="https://m.me/kasorb" target="_blank">สนใจข้อสอบเพิ่มเติม ติดต่อแอดมิน</a></div></section>
<section id="quiz" class="card hide"><h2>ชุดทดลองฟรี</h2><div id="questions"></div><button id="submit" class="orange">ส่งคำตอบ</button><button id="back" class="light">กลับ</button><div id="result"></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{getFirestore,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAE7MoJ1ccr5Pf2pYr6JMyvnPPmBfxd_RE",authDomain:"kasorb-test-ad000.firebaseapp.com",projectId:"kasorb-test-ad000",storageBucket:"kasorb-test-ad000.firebasestorage.app",messagingSenderId:"999267444865",appId:"1:999267444865:web:5509772cd5f94af768c580"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let reg=false;
$("switch").onclick=()=>{reg=!reg;$("title").textContent=reg?"สมัครสมาชิกฟรี":"เข้าสู่ระบบ";$("go").textContent=reg?"สมัครสมาชิก":"เข้าสู่ระบบ";$("switch").textContent=reg?"มีบัญชีแล้ว เข้าสู่ระบบ":"สมัครสมาชิกฟรี";$("msg").textContent=""};
$("go").onclick=async()=>{try{if(reg){let c=await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value);await setDoc(doc(db,"users",c.user.uid),{email:c.user.email,role:"student",plan:"free",active:false,createdAt:serverTimestamp()})}else await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)}catch(e){$("msg").textContent=e.code==="auth/email-already-in-use"?"อีเมลนี้สมัครแล้ว กรุณาเข้าสู่ระบบ":"ดำเนินการไม่สำเร็จ กรุณาตรวจสอบอีเมลและรหัสผ่าน"}};
$("forgot").onclick=async()=>{if(!$("email").value.trim())return $("msg").textContent="กรอกอีเมลก่อน";try{await sendPasswordResetEmail(auth,$("email").value.trim());$("msg").textContent="ส่งอีเมลตั้งรหัสผ่านใหม่แล้ว"}catch(e){$("msg").textContent="ส่งอีเมลไม่สำเร็จ"}};$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$("authBox").classList.toggle("hide",!!u);$("home").classList.toggle("hide",!u);if(u)$("who").textContent=u.email});
const qs=[{q:"ถ้า 5 : 8 = x : 40 แล้ว x มีค่าเท่าใด",c:["5","10","20","25"],a:3,e:"5/8 = x/40 คูณไขว้ จะได้ x = 25"},{q:"ข้อใดเป็นคำซ้ำ",c:["บ้านเรือน","เด็ก ๆ","รถไฟ","น้ำใจ"],a:1,e:"เด็ก ๆ เป็นคำซ้ำโดยใช้ไม้ยมก"},{q:"She ___ to school every day.",c:["go","goes","going","gone"],a:1,e:"She เป็นประธานเอกพจน์ใน Present Simple จึงใช้ goes"},{q:"ข้อใดเป็นเว็บเบราว์เซอร์",c:["Safari","Excel","PowerPoint","Windows"],a:0,e:"Safari เป็นเว็บเบราว์เซอร์"}];
$("start").onclick=()=>{$("home").classList.add("hide");$("quiz").classList.remove("hide");$("result").innerHTML="";$("questions").innerHTML=qs.map((x,i)=>`<div class="q">${i+1}. ${x.q}</div>${x.c.map((v,j)=>`<label><input type="radio" name="q${i}" value="${j}">${j+1}. ${v}</label>`).join("")}`).join("")};
$("back").onclick=()=>{$("quiz").classList.add("hide");$("home").classList.remove("hide")};$("submit").onclick=()=>{let s=0,d="";qs.forEach((x,i)=>{let p=document.querySelector(`input[name=q${i}]:checked`),v=p?+p.value:-1;if(v===x.a)s++;d+=`<p><b>ข้อ ${i+1}: ${v===x.a?"ถูก":"ผิด"}</b><br>เฉลย ${x.a+1}. ${x.c[x.a]}<br>${x.e}</p>`});$("result").innerHTML=`<hr><h2>คะแนน ${s}/${qs.length}</h2>${d}`};
</script></body></html>
