<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="คนนั่งอ่านหนังสือฝึกทำข้อสอบในห้องนอน">
<style>
.page{animation:flip 5s ease-in-out infinite;transform-origin:318px 262px}
@keyframes flip{0%,70%,100%{transform:scaleX(1)}80%{transform:scaleX(-.2)}90%{transform:scaleX(1)}}
.head{animation:nod 4s ease-in-out infinite;transform-origin:330px 205px}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
.hand{animation:write 1.2s ease-in-out infinite;transform-origin:352px 258px}
@keyframes write{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,1px)}}
.steam{animation:steam 3s ease-in-out infinite;opacity:.5}
@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.5}100%{transform:translateY(-10px);opacity:0}}
.leaf{animation:sway 5s ease-in-out infinite;transform-origin:560px 300px}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
.lamp{animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.5}}
</style>
<!-- wall + floor -->
<rect width="640" height="400" fill="#f6f1ea"/>
<rect y="318" width="640" height="82" fill="#ece3d7"/>
<rect y="316" width="640" height="4" fill="#e2d6c6"/>
