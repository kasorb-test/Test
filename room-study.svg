<g>
<rect x="452" y="58" width="12" height="42" fill="#16305f"/><rect x="466" y="64" width="10" height="36" fill="#ff8a3d"/><rect x="478" y="54" width="13" height="46" fill="#c9d6e8"/>
<rect x="493" y="62" width="9" height="38" fill="#f2c14e"/><rect x="504" y="58" width="14" height="42" fill="#9cc5a1"/><rect x="520" y="66" width="10" height="34" fill="#e7a0a6"/>
<rect x="532" y="60" width="12" height="40" fill="#16305f"/><rect x="552" y="84" width="46" height="10" fill="#ff8a3d" transform="rotate(-8 575 89)"/>
<rect x="452" y="126" width="14" height="39" fill="#9cc5a1"/><rect x="468" y="120" width="10" height="45" fill="#f2c14e"/><rect x="480" y="130" width="12" height="35" fill="#e7a0a6"/>
<rect x="494" y="122" width="13" height="43" fill="#c9d6e8"/><rect x="509" y="128" width="9" height="37" fill="#ff8a3d"/><rect x="520" y="118" width="14" height="47" fill="#16305f"/>
<rect x="536" y="126" width="11" height="39" fill="#f2c14e"/><rect x="549" y="124" width="12" height="41" fill="#9cc5a1"/><rect x="563" y="132" width="10" height="33" fill="#e7a0a6"/><rect x="575" y="120" width="13" height="45" fill="#c9d6e8"/>
<rect x="452" y="190" width="12" height="40" fill="#ff8a3d"/><rect x="466" y="184" width="14" height="46" fill="#16305f"/><rect x="482" y="192" width="10" height="38" fill="#9cc5a1"/>
<rect x="500" y="214" width="56" height="8" fill="#f2c14e"/><rect x="503" y="206" width="50" height="8" fill="#e7a0a6"/><rect x="498" y="222" width="60" height="8" fill="#c9d6e8"/>
<rect x="566" y="188" width="12" height="42" fill="#e7a0a6"/><rect x="580" y="194" width="13" height="36" fill="#16305f"/>
</g>
