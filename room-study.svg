<rect x="30" y="262" width="170" height="44" rx="10" fill="#e6ddd0"/>
<rect x="40" y="220" width="56" height="26" rx="12" fill="#fbf7f1" stroke="#eadfcf"/>
<rect x="30" y="200" width="14" height="112" rx="5" fill="#d9c7b0"/>
<rect x="30" y="302" width="170" height="10" rx="4" fill="#d9c7b0"/>
<!-- bookshelf -->
<rect x="440" y="40" width="170" height="200" rx="8" fill="#fff" stroke="#eadfcf"/>
