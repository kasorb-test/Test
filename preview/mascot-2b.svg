<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" role="img" aria-label="มาสคอตดินสอ 2B">
<style>
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:80px 120px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
.eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.wave{animation:wave 1.6s ease-in-out infinite;transform-origin:118px 128px}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
.shadow{animation:sh 2.6s ease-in-out infinite;transform-origin:80px 228px}
@keyframes sh{0%,100%{transform:scaleX(1);opacity:.18}50%{transform:scaleX(.82);opacity:.1}}
</style>
<ellipse class="shadow" cx="80" cy="228" rx="34" ry="6" fill="#000"/>
<g class="bob">
  <!-- arms -->
  <path d="M44 128c-14 4-20 14-18 24" stroke="#3a2a1a" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="26" cy="153" r="6" fill="#fff" stroke="#3a2a1a" stroke-width="3"/>
  <g class="wave"><path d="M116 128c14-6 20-18 18-30" stroke="#3a2a1a" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="134" cy="96" r="6" fill="#fff" stroke="#3a2a1a" stroke-width="3"/></g>
  <!-- eraser + ferrule -->
  <rect x="46" y="18" width="68" height="30" rx="12" fill="#f7a8b8"/>
  <rect x="46" y="18" width="68" height="12" rx="6" fill="#fbc3cf"/>
  <rect x="44" y="44" width="72" height="20" rx="3" fill="#c9ced6"/>
  <rect x="44" y="49" width="72" height="3" fill="#aab1bc"/><rect x="44" y="56" width="72" height="3" fill="#aab1bc"/>
  <!-- body (hexagon faces) -->
  <rect x="46" y="64" width="68" height="116" fill="#ffb21e"/>
  <rect x="46" y="64" width="18" height="116" fill="#ffc54d"/>
  <rect x="96" y="64" width="18" height="116" fill="#f29a0c"/>
  <!-- wood + graphite -->
  <path d="M46 180h68l-34 42z" fill="#f3d3a6"/>
  <path d="M46 180h18l16 42z" fill="#f8e1bf"/>
  <path d="M71 210h18l-9 12z" fill="#2b2b2b"/>
  <!-- face -->
  <g class="eye"><ellipse cx="67" cy="102" rx="5.5" ry="7" fill="#2b1d10"/><circle cx="69" cy="99" r="2" fill="#fff"/></g>
  <g class="eye"><ellipse cx="93" cy="102" rx="5.5" ry="7" fill="#2b1d10"/><circle cx="95" cy="99" r="2" fill="#fff"/></g>
  <ellipse cx="58" cy="115" rx="6" ry="3.5" fill="#ff7f6e" opacity=".55"/>
  <ellipse cx="102" cy="115" rx="6" ry="3.5" fill="#ff7f6e" opacity=".55"/>
  <path d="M71 116q9 9 18 0" stroke="#2b1d10" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- 2B label -->
  <rect x="58" y="136" width="44" height="26" rx="6" fill="#16305f"/>
  <text x="80" y="155" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="18" fill="#fff">2B</text>
</g>
</svg>
