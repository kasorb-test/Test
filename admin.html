<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KASORB Admin</title><style>body{font-family:system-ui;background:#f5f5f5;margin:0}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;padding:20px;border-radius:16px;margin:14px 0}input,button{width:100%;padding:12px;margin:5px 0;box-sizing:border-box}button{background:#f47b20;color:white;border:0;border-radius:10px;font-weight:700}.hide{display:none}.u{padding:12px 0;border-bottom:1px solid #eee}.muted{color:#666}label{display:block;font-weight:700;margin-top:12px}textarea,select{width:100%;padding:12px;margin:5px 0;box-sizing:border-box;font:inherit}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ok{color:#16834a;font-weight:700}</style></head><body><main><h1>KASORB TEST — ADMIN</h1><div id="login" class="card"><h2>เข้าสู่ระบบแอดมิน</h2><input id="email" type="email" placeholder="อีเมล"><input id="pass" type="password" placeholder="รหัสผ่าน"><button id="go">เข้าสู่ระบบ</button><p id="msg"></p></div><div id="homeCard" class="card hide"><h2>หน้าหลักของเว็บ</h2><p class="muted">แก้วันสอบ ข่าวสาร และข้อสอบประจำวัน แล้วกดบันทึก</p>
<h3>การ์ดนับถอยหลัง</h3>
<div class="row"><div><label>การ์ดที่ 1: สายงาน</label><input id="exam0Title"></div><div><label>วันสอบ</label><input id="exam0Date" type="date"></div></div>
<div class="row"><div><label>การ์ดที่ 2: สายงาน</label><input id="exam1Title"></div><div><label>วันสอบ</label><input id="exam1Date" type="date"></div></div>
<label>จำนวนข้อสอบทั้งหมดในเว็บ</label><input id="totalQuestions" type="number" min="0">
<label>ข่าวสาร (1 บรรทัด = 1 ข่าว, ข่าวใหม่ไว้บนสุด)</label><textarea id="newsText" placeholder="เปิดรับสมัครสอบนายสิบตำรวจแล้ว"></textarea>
<h3>ข้อสอบประจำวัน</h3>
<label>คำถาม</label><textarea id="dailyQ"></textarea>
<label style="font-weight:400"><input id="dailyEng" type="checkbox" style="width:auto"> ข้อสอบภาษาอังกฤษ (ตัวเลือกเป็น A B C D แทน 1 2 3 4)</label>
<div class="row"><div><label>ตัวเลือก 1</label><input id="dailyC0"></div><div><label>ตัวเลือก 2</label><input id="dailyC1"></div><div><label>ตัวเลือก 3</label><input id="dailyC2"></div><div><label>ตัวเลือก 4</label><input id="dailyC3"></div></div>
<label>ข้อที่ถูก</label><select id="dailyAns"><option value="0">ตัวเลือก 1</option><option value="1">ตัวเลือก 2</option><option value="2">ตัวเลือก 3</option><option value="3">ตัวเลือก 4</option></select>
<label>คำอธิบายเฉลย (ไม่บังคับ)</label><textarea id="dailyExp"></textarea>
<button id="saveHome">บันทึกหน้าหลัก</button><p id="homeMsg"></p></div>
<div id="panel" class="card hide"><h2>สมาชิก</h2><p class="muted">กดเปิดสิทธิ์หลังลูกค้าชำระกับแอดมิน</p><div id="users"></div><button id="out">ออกจากระบบ</button></div></main>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,updateDoc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyAE7MoJ1ccr5Pf2pYr6JMyvnPPmBfxd_RE",authDomain:"kasorb-test-ad000.firebaseapp.com",projectId:"kasorb-test-ad000",storageBucket:"kasorb-test-ad000.firebasestorage.app",messagingSenderId:"999267444865",appId:"1:999267444865:web:5509772cd5f94af768c580"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
$("go").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)}catch(e){$("msg").textContent="เข้าสู่ระบบไม่สำเร็จ"}};$("out").onclick=()=>signOut(auth);
async function load(){try{let s=await getDocs(collection(db,"users")),a=[];s.forEach(d=>{let u=d.data();if(u.role!=="admin")a.push({id:d.id,...u})});setDoc(doc(db,"site","home"),{members:a.length},{merge:true}).catch(()=>{});$("users").innerHTML=a.length?a.map(u=>`<div class="u"><b>${esc(u.email)}</b><br><span class="muted">${u.plan==="premium"?"สิทธิ์เพิ่มเติม":"สมาชิกฟรี"}</span><button data-id="${esc(u.id)}" data-plan="${u.plan==="premium"?"premium":"free"}">${u.plan==="premium"?"กลับเป็นสมาชิกฟรี":"เปิดสิทธิ์เพิ่มเติม"}</button></div>`).join(""):"ยังไม่มีสมาชิก";document.querySelectorAll(".u button").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.id),{plan:b.dataset.plan==="premium"?"free":"premium"});load()})}catch(e){$("users").textContent="โหลดรายชื่อไม่ได้"}}
onAuthStateChanged(auth,async u=>{if(!u){$("login").classList.remove("hide");$("panel").classList.add("hide");$("homeCard").classList.add("hide");return}if(u.email!=="thananitwit@gmail.com"){await signOut(auth);return}$("login").classList.add("hide");$("panel").classList.remove("hide");$("homeCard").classList.remove("hide");load();loadHome()});
async function loadHome(){try{const s=await getDoc(doc(db,"site","home"));const h=s.exists()?s.data():{};const ex=(h.exams&&h.exams.length)?h.exams:[{title:"สายอำนวยการ และสายพิสูจน์หลักฐาน",date:"2026-11-29"},{title:"สายปราบปราม",date:"2027-01-17"}];[0,1].forEach(i=>{$("exam"+i+"Title").value=(ex[i]||{}).title||"";$("exam"+i+"Date").value=(ex[i]||{}).date||""});$("totalQuestions").value=h.totalQuestions||"";$("newsText").value=(h.news||[]).map(n=>n.text).join("\n");const d=h.daily||{};$("dailyQ").value=d.question||"";[0,1,2,3].forEach(i=>$("dailyC"+i).value=(d.choices||[])[i]||"");$("dailyAns").value=String(d.answer??0);$("dailyExp").value=d.explanation||"";$("dailyEng").checked=!!d.english}catch(e){$("homeMsg").textContent="โหลดข้อมูลหน้าหลักไม่ได้"}}
$("saveHome").onclick=async()=>{const old=await getDoc(doc(db,"site","home")).then(s=>s.exists()?s.data():{}).catch(()=>({}));const oldDates=new Map((old.news||[]).map(n=>[n.text,n.date]));const today=new Date().toISOString().slice(0,10);const news=$("newsText").value.split("\n").map(t=>t.trim()).filter(Boolean).slice(0,10).map(text=>({text,date:oldDates.get(text)||today}));const choices=[0,1,2,3].map(i=>$("dailyC"+i).value.trim()).filter(Boolean);try{await setDoc(doc(db,"site","home"),{exams:[0,1].map(i=>({title:$("exam"+i+"Title").value.trim(),date:$("exam"+i+"Date").value})).filter(e=>e.title),totalQuestions:Number($("totalQuestions").value)||0,news,daily:{question:$("dailyQ").value.trim(),choices,answer:Math.min(Number($("dailyAns").value),Math.max(choices.length-1,0)),explanation:$("dailyExp").value.trim(),english:$("dailyEng").checked},updatedAt:new Date().toISOString()},{merge:true});$("homeMsg").className="ok";$("homeMsg").textContent="บันทึกแล้ว"}catch(e){$("homeMsg").className="";$("homeMsg").textContent="บันทึกไม่สำเร็จ (ตรวจสอบ Firestore Rules)"}};
</script></body></html>
