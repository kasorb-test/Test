<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KASORB Admin</title><style>body{font-family:system-ui;background:#f5f5f5;margin:0}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;padding:20px;border-radius:16px;margin:14px 0}input,button{width:100%;padding:12px;margin:5px 0;box-sizing:border-box}button{background:#f47b20;color:white;border:0;border-radius:10px;font-weight:700}.hide{display:none}.u{padding:12px 0;border-bottom:1px solid #eee}.muted{color:#666}</style></head><body><main><h1>KASORB TEST — ADMIN</h1><div id="login" class="card"><h2>เข้าสู่ระบบแอดมิน</h2><input id="email" type="email" placeholder="อีเมล"><input id="pass" type="password" placeholder="รหัสผ่าน"><button id="go">เข้าสู่ระบบ</button><p id="msg"></p></div><div id="panel" class="card hide"><h2>สมาชิก</h2><p class="muted">กดเปิดสิทธิ์หลังลูกค้าชำระกับแอดมิน</p><div id="users"></div><button id="out">ออกจากระบบ</button></div></main>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,updateDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyAE7MoJ1ccr5Pf2pYr6JMyvnPPmBfxd_RE",authDomain:"kasorb-test-ad000.firebaseapp.com",projectId:"kasorb-test-ad000",storageBucket:"kasorb-test-ad000.firebasestorage.app",messagingSenderId:"999267444865",appId:"1:999267444865:web:5509772cd5f94af768c580"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);
$("go").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)}catch(e){$("msg").textContent="เข้าสู่ระบบไม่สำเร็จ"}};$("out").onclick=()=>signOut(auth);
async function load(){try{let s=await getDocs(collection(db,"users")),a=[];s.forEach(d=>{let u=d.data();if(u.role!=="admin")a.push({id:d.id,...u})});$("users").innerHTML=a.length?a.map(u=>`<div class="u"><b>${u.email}</b><br><span class="muted">${u.plan==="premium"?"สิทธิ์เพิ่มเติม":"สมาชิกฟรี"}</span><button data-id="${u.id}" data-plan="${u.plan||"free"}>${u.plan==="premium"?"กลับเป็นสมาชิกฟรี":"เปิดสิทธิ์เพิ่มเติม"}</button></div>`).join(""):"ยังไม่มีสมาชิก";document.querySelectorAll(".u button").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"users",b.dataset.id),{plan:b.dataset.plan==="premium"?"free":"premium"});load()})}catch(e){$("users").textContent="โหลดรายชื่อไม่ได้"}}
onAuthStateChanged(auth,async u=>{if(!u){$("login").classList.remove("hide");$("panel").classList.add("hide");return}if(u.email!=="thananitwit@gmail.com"){await signOut(auth);return}$("login").classList.add("hide");$("panel").classList.remove("hide");load()});
</script></body></html>
