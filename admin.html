<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KASORB Admin</title><style>body{font-family:system-ui;background:#f5f5f5;margin:0}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;padding:20px;border-radius:16px;margin:14px 0}input,button{width:100%;padding:12px;margin:5px 0;box-sizing:border-box}button{background:#f47b20;color:white;border:0;border-radius:10px;font-weight:700}.hide{display:none}.u{padding:12px 0;border-bottom:1px solid #eee}.muted{color:#666}label{display:block;font-weight:700;margin-top:12px}textarea,select{width:100%;padding:12px;margin:5px 0;box-sizing:border-box;font:inherit}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ok{color:#16834a;font-weight:700}.pw{position:relative}.pw input{padding-right:70px}.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:8px 10px;background:#eee;color:#333;font-weight:700;font-size:13px}.light{background:#eee;color:#333}#msg{line-height:1.6}#msg.err{color:#c62828;font-weight:700}#msg.ok{color:#16834a}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}.tabs button{width:auto;margin:0;padding:7px 12px;border-radius:999px;background:#f2f2f2;color:#555;font-size:13px}.tabs button.on{background:#f47b20;color:#fff}.tabs b{opacity:.75;margin-left:2px}.mt{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}.mt th{text-align:left;color:#999;font-size:12px;padding:8px 6px;border-bottom:1px solid #eee}.mt td{padding:11px 6px;border-bottom:1px solid #f4f4f4;vertical-align:middle}.mt .name{font-weight:800}.mt .mail{color:#666;word-break:break-all}.mt .pc{width:1%;white-space:nowrap}.seg{display:flex;background:#f2f2f2;border-radius:10px;padding:3px}.seg button{width:auto;margin:0;flex:1;padding:8px 12px;border-radius:8px;background:transparent;color:#666;font-size:13px}.seg button.on{background:#fff;color:#e86208;box-shadow:0 1px 4px rgba(0,0,0,.12)}.seg button.on.lifetime{color:#15803d}.seg.busy{opacity:.5;pointer-events:none}.exp{font-size:12px;margin-top:4px;color:#e86208;white-space:normal}.exp.lifetime{color:#15803d}.exp.free{color:#999}#umsg{min-height:1.2em;margin:6px 0}.until{width:auto;margin:0 0 0 4px;padding:4px 6px;border:1px solid #f3c7a3;border-radius:7px;font:inherit;font-size:12px;color:#e86208;background:#fff8f2}@media(max-width:600px){.mt .col-mail{display:none}.mt .mail-sm{display:block!important;font-weight:400;font-size:12px}}</style></head><body><main><h1>KASORB TEST — ADMIN</h1><div id="login" class="card"><h2>เข้าสู่ระบบแอดมิน</h2><input id="email" type="email" placeholder="อีเมล"><div class="pw"><input id="pass" type="password" placeholder="รหัสผ่าน"><button id="eye" class="eye" type="button">แสดง</button></div><button id="go">เข้าสู่ระบบ</button><button id="forgot" class="light" type="button">ลืมรหัสผ่าน</button><p id="msg"></p></div><div id="homeCard" class="card hide"><h2>หน้าหลักของเว็บ</h2><p class="muted">แก้วันสอบ ข่าวสาร และข้อสอบประจำวัน แล้วกดบันทึก</p>
<h3>การ์ดนับถอยหลัง</h3>
<div class="row"><div><label>การ์ดที่ 1: สายงาน</label><input id="exam0Title"></div><div><label>วันสอบ</label><input id="exam0Date" type="date"></div></div>
<div class="row"><div><label>การ์ดที่ 2: สายงาน</label><input id="exam1Title"></div><div><label>วันสอบ</label><input id="exam1Date" type="date"></div></div>
<label>จำนวนข้อสอบทั้งหมดในเว็บ</label><input id="totalQuestions" type="number" min="0">
<label>ข่าวสาร (1 บรรทัด = 1 ข่าว, ข่าวใหม่ไว้บนสุด)</label><textarea id="newsText" placeholder="เปิดรับสมัครสอบนายสิบตำรวจแล้ว"></textarea>
<h3>ข้อสอบประจำวัน</h3>
<label>คำถาม</label><textarea id="dailyQ"></textarea>
<label style="font-weight:400"><input id="dailyEng" type="checkbox" style="width:auto"> ข้อสอบภาษาอังกฤษ (ตัวเลือกเป็น A B C D แทน 1 2 3 4)</label>
<div class="row"><div><label>ตัวเลือก 1</label><input id="dailyC0"></div><div><label>ตัวเลือก 2</label><input id="dailyC1"></div><div><label>ตัวเลือก 3</label><input id="dailyC2"></div><div><label>ตัวเลือก 4</label><input id="dailyC3"></div></div>
<label>ข้อที่ถูก</label><select id="dailyAns"><option value="0">ตัวเลือก 1</option><option value="1">ตัวเลือก 2</option><option value="2">ตัวเลือก 3</option><option value="3">ตัวเลือก 4</option></select>
<label>คำอธิบายเฉลย (ไม่บังคับ)</label><textarea id="dailyExp"></textarea>
<button id="saveHome">บันทึกหน้าหลัก</button><p id="homeMsg"></p></div>
<div id="panel" class="card hide"><h2>สมาชิก</h2><p class="muted">เลือกแพ็กเกจหลังลูกค้าชำระกับแอดมิน รายปีนับ 1 ปีจากวันที่กด</p>
<div id="tabs" class="tabs"><button type="button" data-f="all" class="on">ทั้งหมด <b>0</b></button><button type="button" data-f="free">ฟรี <b>0</b></button><button type="button" data-f="yearly">รายปี <b>0</b></button><button type="button" data-f="lifetime">ตลอดชีพ <b>0</b></button></div>
<input id="q" type="search" placeholder="ค้นหาอีเมลหรือชื่อเล่น"><p id="umsg" class="ok"></p>
<div id="users"></div><button id="out">ออกจากระบบ</button></div></main>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,updateDoc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyAE7MoJ1ccr5Pf2pYr6JMyvnPPmBfxd_RE",authDomain:"kasorb-test-ad000.firebaseapp.com",projectId:"kasorb-test-ad000",storageBucket:"kasorb-test-ad000.firebasestorage.app",messagingSenderId:"999267444865",appId:"1:999267444865:web:5509772cd5f94af768c580"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const ADMIN="thananitwit@gmail.com";
const say=(t,cls)=>{$("msg").textContent=t;$("msg").className=cls||""};
const authError=e=>({"auth/invalid-credential":"อีเมลหรือรหัสผ่านไม่ถูกต้อง ถ้าจำรหัสผ่านไม่ได้ กดปุ่ม ลืมรหัสผ่าน","auth/wrong-password":"รหัสผ่านไม่ถูกต้อง ถ้าจำไม่ได้ กดปุ่ม ลืมรหัสผ่าน","auth/user-not-found":"ไม่พบบัญชีอีเมลนี้","auth/invalid-email":"รูปแบบอีเมลไม่ถูกต้อง","auth/missing-password":"กรุณากรอกรหัสผ่าน","auth/too-many-requests":"ลองผิดหลายครั้งเกินไป ระบบล็อกชั่วคราว กรุณารอสักครู่ หรือกด ลืมรหัสผ่าน","auth/user-disabled":"บัญชีนี้ถูกปิดใช้งาน","auth/network-request-failed":"เชื่อมต่ออินเทอร์เน็ตไม่ได้ กรุณาลองใหม่"})[e&&e.code]||("เข้าสู่ระบบไม่สำเร็จ ("+(e&&e.code||"ไม่ทราบสาเหตุ")+")");
$("eye").onclick=()=>{const h=$("pass").type==="password";$("pass").type=h?"text":"password";$("eye").textContent=h?"ซ่อน":"แสดง"};
$("go").onclick=async()=>{const email=$("email").value.trim().toLowerCase();if(!email||!$("pass").value){say("กรุณากรอกอีเมลและรหัสผ่าน","err");return}if(email!==ADMIN){say("อีเมลนี้ไม่ใช่บัญชีแอดมิน","err");return}say("กำลังเข้าสู่ระบบ…");try{await signInWithEmailAndPassword(auth,email,$("pass").value)}catch(e){say(authError(e),"err")}};
$("pass").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("forgot").onclick=async()=>{const email=$("email").value.trim().toLowerCase()||ADMIN;$("email").value=email;try{await sendPasswordResetEmail(auth,email);say("ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่ "+email+" แล้ว กรุณาเช็กอีเมล (รวมถึงกล่องจดหมายขยะ)","ok")}catch(e){say(authError(e),"err")}};$("out").onclick=()=>signOut(auth);
/* สมาชิก: ตาราง + แท็บกรอง + เลือกแพ็กเกจ ฟรี / รายปี / ตลอดชีพ */
let members=[],filter="all";
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const thDate=s=>new Date(`${s}T00:00:00`).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
const planOf=u=>{if(u.plan!=="premium")return"free";if(u.planType==="yearly")return u.premiumUntil&&u.premiumUntil<ymd(new Date())?"expired":"yearly";return"lifetime"};
const groupOf=u=>{const p=planOf(u);return p==="expired"?"free":p};
const PLANS=[["free","ฟรี"],["yearly","รายปี"],["lifetime","ตลอดชีพ"]];
function planNote(u){const p=planOf(u);if(p==="yearly")return`หมดอายุ ${thDate(u.premiumUntil)}`;if(p==="lifetime")return"ใช้ได้ตลอดชีพ";if(p==="expired")return`รายปีหมดอายุแล้ว ${thDate(u.premiumUntil)}`;return""}
function renderMembers(){
const q=$("q").value.trim().toLowerCase();
const counts={all:members.length,free:0,yearly:0,lifetime:0};
members.forEach(u=>counts[groupOf(u)]++);
document.querySelectorAll("#tabs button").forEach(t=>{t.classList.toggle("on",t.dataset.f===filter);t.querySelector("b").textContent=counts[t.dataset.f]});
const list=members.filter(u=>(filter==="all"||groupOf(u)===filter)&&(!q||(u.email||"").toLowerCase().includes(q)||(u.nickname||"").toLowerCase().includes(q)));
if(!members.length){$("users").innerHTML='<p class="muted">ยังไม่มีสมาชิก</p>';return}
if(!list.length){$("users").innerHTML='<p class="muted">ไม่พบสมาชิก</p>';return}
$("users").innerHTML=`<table class="mt"><thead><tr><th>ชื่อเล่น</th><th class="col-mail">อีเมล</th><th>แพ็กเกจ</th></tr></thead><tbody>${list.map(u=>{const g=groupOf(u);return`<tr><td><div class="name">${esc(u.nickname||"-")}<span class="mail mail-sm" style="display:none">${esc(u.email)}</span></div></td><td class="mail col-mail">${esc(u.email)}</td><td class="pc"><div class="seg" data-id="${esc(u.id)}">${PLANS.map(([v,l])=>`<button type="button" data-v="${v}" class="${g===v?"on "+v:""}">${l}</button>`).join("")}</div>${g==="yearly"?`<div class="exp yearly">หมดอายุ <input type="date" class="until" data-id="${esc(u.id)}" value="${esc(u.premiumUntil)}"></div>`:`<div class="exp ${g}">${planNote(u)}</div>`}</td></tr>`}).join("")}</tbody></table>`;
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setPlan(b.parentElement,b.dataset.v));
document.querySelectorAll(".until").forEach(i=>i.onchange=()=>setUntil(i));
}
async function setPlan(seg,v){
const u=members.find(x=>x.id===seg.dataset.id);if(!u)return;
const cur=planOf(u),who=u.nickname||u.email;let data;
if(v==="free"){if(groupOf(u)==="free")return;if(!confirm(`เปลี่ยน ${who} กลับเป็นสมาชิกฟรี?`))return;data={plan:"free",planType:null,premiumUntil:null}}
else if(v==="lifetime"){if(cur==="lifetime")return;if(!confirm(`เปลี่ยน ${who} เป็นตลอดชีพ (ไม่มีวันหมดอายุ)?`))return;data={plan:"premium",planType:"lifetime",premiumUntil:null}}
else{const start=cur==="yearly"?new Date(`${u.premiumUntil}T00:00:00`):new Date();const end=new Date(start);end.setFullYear(end.getFullYear()+1);
const ask=cur==="yearly"?`ต่ออายุรายปีให้ ${who} อีก 1 ปี\nจากวันหมดอายุเดิม ${thDate(u.premiumUntil)} เป็น ${thDate(ymd(end))}?`:`เปลี่ยน ${who} เป็นรายปี\nเริ่ม ${thDate(ymd(start))} ถึง ${thDate(ymd(end))}?`;
if(!confirm(ask))return;data={plan:"premium",planType:"yearly",premiumUntil:ymd(end)}}
await savePlan(seg,u,data,v);
}
async function setUntil(input){
const u=members.find(x=>x.id===input.dataset.id);if(!u||!input.value||input.value===u.premiumUntil)return;
if(!confirm(`แก้วันหมดอายุของ ${u.nickname||u.email} เป็น ${thDate(input.value)}?`)){input.value=u.premiumUntil;return}
await savePlan(input.closest("td").querySelector(".seg"),u,{plan:"premium",planType:"yearly",premiumUntil:input.value},"yearly");
}
async function savePlan(seg,u,data,v){const who=u.nickname||u.email;
seg.classList.add("busy");$("umsg").className="ok";$("umsg").textContent="กำลังบันทึก…";
try{await updateDoc(doc(db,"users",u.id),data);Object.assign(u,data);renderMembers();$("umsg").textContent=`บันทึกแล้ว: ${who} เป็น ${PLANS.find(p=>p[0]===v)[1]}${data.premiumUntil?` ถึง ${thDate(data.premiumUntil)}`:""}`}
catch(e){seg.classList.remove("busy");$("umsg").className="";$("umsg").textContent=`บันทึกไม่สำเร็จ (${e.code||e.message}) — ตรวจสอบว่า Publish firestore.rules ล่าสุดแล้ว`}
}
document.querySelectorAll("#tabs button").forEach(t=>t.onclick=()=>{filter=t.dataset.f;renderMembers()});
$("q").oninput=renderMembers;
async function load(){try{let s=await getDocs(collection(db,"users")),a=[];s.forEach(d=>{let u=d.data();if(u.role!=="admin"&&(u.email||"").toLowerCase()!==ADMIN)a.push({id:d.id,...u})});a.sort((x,y)=>(x.email||"").localeCompare(y.email||""));members=a;setDoc(doc(db,"site","home"),{members:a.length},{merge:true}).catch(()=>{});renderMembers()}catch(e){$("users").textContent="โหลดรายชื่อไม่ได้"}}
onAuthStateChanged(auth,async u=>{if(!u){$("login").classList.remove("hide");$("panel").classList.add("hide");$("homeCard").classList.add("hide");return}if((u.email||"").toLowerCase()!==ADMIN){await signOut(auth);say("อีเมลนี้ไม่ใช่บัญชีแอดมิน","err");return}say("");$("login").classList.add("hide");$("panel").classList.remove("hide");$("homeCard").classList.remove("hide");load();loadHome()});
async function loadHome(){try{const s=await getDoc(doc(db,"site","home"));const h=s.exists()?s.data():{};const ex=(h.exams&&h.exams.length)?h.exams:[{title:"สายอำนวยการ และสายพิสูจน์หลักฐาน",date:"2026-11-29"},{title:"สายปราบปราม",date:"2027-01-17"}];[0,1].forEach(i=>{$("exam"+i+"Title").value=(ex[i]||{}).title||"";$("exam"+i+"Date").value=(ex[i]||{}).date||""});$("totalQuestions").value=h.totalQuestions||"";$("newsText").value=(h.news||[]).map(n=>n.text).join("\n");const d=h.daily||{};$("dailyQ").value=d.question||"";[0,1,2,3].forEach(i=>$("dailyC"+i).value=(d.choices||[])[i]||"");$("dailyAns").value=String(d.answer??0);$("dailyExp").value=d.explanation||"";$("dailyEng").checked=!!d.english}catch(e){$("homeMsg").textContent="โหลดข้อมูลหน้าหลักไม่ได้"}}
$("saveHome").onclick=async()=>{const old=await getDoc(doc(db,"site","home")).then(s=>s.exists()?s.data():{}).catch(()=>({}));const oldDates=new Map((old.news||[]).map(n=>[n.text,n.date]));const today=new Date().toISOString().slice(0,10);const news=$("newsText").value.split("\n").map(t=>t.trim()).filter(Boolean).slice(0,10).map(text=>({text,date:oldDates.get(text)||today}));const choices=[0,1,2,3].map(i=>$("dailyC"+i).value.trim()).filter(Boolean);try{await setDoc(doc(db,"site","home"),{exams:[0,1].map(i=>({title:$("exam"+i+"Title").value.trim(),date:$("exam"+i+"Date").value})).filter(e=>e.title),totalQuestions:Number($("totalQuestions").value)||0,news,daily:{question:$("dailyQ").value.trim(),choices,answer:Math.min(Number($("dailyAns").value),Math.max(choices.length-1,0)),explanation:$("dailyExp").value.trim(),english:$("dailyEng").checked},updatedAt:new Date().toISOString()},{merge:true});$("homeMsg").className="ok";$("homeMsg").textContent="บันทึกแล้ว"}catch(e){$("homeMsg").className="";$("homeMsg").textContent="บันทึกไม่สำเร็จ (ตรวจสอบ Firestore Rules)"}};
</script></body></html>
